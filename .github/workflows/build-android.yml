name: Build Habit Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the build number (commit count) is correct

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install JavaScript dependencies
        run: npm install

      - name: Stamp build number and OTA update address
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_BASE_URL=https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          BUILD_NUMBER=$BUILD_NUMBER npm run stamp-version

      - name: Bundle native Android code (back button + auto-update)
        run: npm run build:native

      - name: Generate Android project
        run: npx cap add android

      - name: Apply native tweaks (splash colours)
        run: npm run patch:android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Generate Android launcher icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
